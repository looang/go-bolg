{{template "base" .}}

{{define "content"}}
<section class="about">
    <h1>关于</h1>
    <div class="about-content">
        <p>Go Blog 是一个用Go语言构建的简洁博客系统。</p>
        <h2>功能特点</h2>
        <ul>
            <li>支持Markdown语法</li>
            <li>响应式设计</li>
            <li>后台管理界面</li>
            <li>SQLite数据库存储</li>
            <li>简洁美观的界面</li>
        </ul>
        <h2>技术栈</h2>
        <ul>
            <li>Go语言</li>
            <li>Gorilla Mux路由</li>
            <li>SQLite数据库</li>
            <li>Markdown解析</li>
            <li>HTML模板</li>
        </ul>
    </div>
</section>
{{end}}
